<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tech Hub Visitor Log - Front desk visitor check-in system linked with Firebase." />
  <title>Tech Hub Visitor Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-badge">
        <span class="live-dot"></span>
        <span>Front Desk Reception</span>
      </div>
      <h1 class="app-title">Tech Hub Visitor Log</h1>
      <p class="app-subtitle">Welcome visitors and monitor current on-site guests.</p>
    </header>

    <!-- Optional alert banner for errors -->
    <div id="status-banner" class="status-banner"></div>

    <main class="dashboard-grid">
      <!-- Left Column: The Form -->
      <section class="card form-card">
        <div class="card-header-row">
          <h2>Sign In</h2>
        </div>
        <p class="card-description">Please enter visitor credentials to check in.</p>

        <form id="visitor-form">
          <div class="form-group">
            <label for="visitor-name">
              Visitor Name <span class="required-star">*</span>
            </label>
            <input 
              type="text" 
              id="visitor-name" 
              name="visitorName" 
              placeholder="e.g., Sarah Connor" 
              required 
              autocomplete="name" 
            />
          </div>

          <div class="form-group">
            <label for="company-visiting">
              Company Visiting <span class="required-star">*</span>
            </label>
            <input 
              type="text" 
              id="company-visiting" 
              name="companyVisiting" 
              placeholder="e.g., Cyberdyne Systems" 
              required 
              autocomplete="organization" 
            />
          </div>

          <button type="submit" id="submit-btn" class="btn-primary">
            Submit
          </button>
        </form>
      </section>

      <!-- Right Column: The Log -->
      <section class="card log-card">
        <div class="card-header-row">
          <h2>Current Visitors</h2>
          <span id="visitor-count" class="visitor-badge">0 Logged</span>
        </div>
        <p class="card-description">Real-time log of visitors loaded from Firebase Firestore.</p>

        <!-- Empty state placeholder -->
        <div id="empty-state" class="empty-state">
          No visitors currently signed in.
        </div>

        <!-- The required empty list -->
        <ul id="visitor-list"></ul>
      </section>
    </main>
  </div>

  <!-- Connect script.js as an ES Module -->
  <script type="module" src="script.js"></script>
</body>

</html>
